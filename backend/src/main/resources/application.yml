spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gaonsehhar}
    username: ${DB_USERNAME:gaonsehhar}
    password: ${DB_PASSWORD:gaonsehhar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: false
server:
  port: ${PORT:8080}
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
spring.cache:
  type: redis
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  notifications:
    log:
      enabled: ${NOTIFICATION_LOG_ENABLED:true}
    sms:
      enabled: ${SMS_NOTIFICATION_ENABLED:false}
      api-key: ${TEXTBELT_API_KEY:}
    whatsapp:
      enabled: ${WHATSAPP_NOTIFICATION_ENABLED:false}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      api-version: ${WHATSAPP_API_VERSION:v22.0}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
