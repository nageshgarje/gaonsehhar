spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gaonsehhar}
    username: ${DB_USERNAME:gaonsehhar}
    password: ${DB_PASSWORD:gaonsehhar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: false
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
