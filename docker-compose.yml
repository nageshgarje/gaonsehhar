services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gaonsehhar
      POSTGRES_USER: gaonsehhar
      POSTGRES_PASSWORD: gaonsehhar
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaonsehhar -d gaonsehhar"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
